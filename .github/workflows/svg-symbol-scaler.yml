name: SVG symbol scaler

# Legacy workflow kept for reference. Automatic CI is intentionally disabled.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Tools/SvgSymbolScaler.Tests/SvgSymbolScaler.Tests.csproj --configuration Release
