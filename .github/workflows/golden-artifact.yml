name: Golden conversion artifact

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: golden-ci-output
  cancel-in-progress: false

jobs:
  golden-artifact:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore main project
        run: dotnet restore SvgToMusicXmlPoc.csproj

      - name: Build main project
        run: dotnet build SvgToMusicXmlPoc.csproj --configuration Release --no-restore

      - name: Convert Yellow Leaves golden SVG
        id: convert
        continue-on-error: true
        run: |
          mkdir -p artifacts
          dotnet run --project SvgToMusicXmlPoc.csproj --configuration Release --no-build --no-launch-profile -- \
            convert \
            Samples/score_15.svg \
            References/catalog.json \
            artifacts/yellow-leaves.musicxml

      - name: Build recognition inventory
        if: steps.convert.outcome == 'success'
        run: |
          python3 Scripts/artifact_inventory.py \
            artifacts/yellow-leaves.analysis.json \
            artifacts/yellow-leaves.classification.json \
            artifacts/yellow-leaves
          python3 Scripts/missing_stem_beam_probe.py \
            artifacts/yellow-leaves.analysis.json \
            artifacts/yellow-leaves.beam-probe.md

      - name: Show generated files
        if: always()
        shell: bash
        run: |
          echo "Generated artifact contents:"
          find artifacts -maxdepth 1 -type f -printf '%f\n' | sort || true

      - name: Upload golden conversion artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yellow-leaves-pr-${{ github.event.pull_request.number }}
          path: |
            artifacts/yellow-leaves.musicxml
            artifacts/yellow-leaves.analysis.json
            artifacts/yellow-leaves.classification.json
            artifacts/yellow-leaves.performance.json
            artifacts/yellow-leaves.inventory.json
            artifacts/yellow-leaves.inventory.md
            artifacts/yellow-leaves.beam-probe.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest conversion to ci-output
        if: steps.convert.outcome == 'success' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/golden-latest
          cp artifacts/yellow-leaves.musicxml /tmp/golden-latest/
          cp artifacts/yellow-leaves.analysis.json /tmp/golden-latest/
          cp artifacts/yellow-leaves.classification.json /tmp/golden-latest/
          cp artifacts/yellow-leaves.performance.json /tmp/golden-latest/
          cp artifacts/yellow-leaves.inventory.json /tmp/golden-latest/
          cp artifacts/yellow-leaves.inventory.md /tmp/golden-latest/
          cp artifacts/yellow-leaves.beam-probe.md /tmp/golden-latest/

          cat > /tmp/golden-latest/source.txt <<EOF
          PR: #${{ github.event.pull_request.number }}
          Head SHA: ${{ github.event.pull_request.head.sha }}
          Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin ci-output:refs/remotes/origin/ci-output 2>/dev/null; then
            git switch -C ci-output origin/ci-output
          else
            git switch --orphan ci-output
            git rm -rf . >/dev/null 2>&1 || true
          fi

          rm -rf latest
          mkdir -p latest
          cp /tmp/golden-latest/* latest/

          git add -A latest
          if git diff --cached --quiet; then
            echo "ci-output/latest is already up to date"
          else
            git commit -m "Update Yellow Leaves from PR #${{ github.event.pull_request.number }}"
            git push origin ci-output
          fi

      - name: Add download hint to workflow summary
        if: always()
        run: |
          {
            echo '## Golden conversion artifact'
            echo
            echo 'Download **yellow-leaves-pr-${{ github.event.pull_request.number }}** from the Artifacts section at the bottom of this workflow run.'
            echo
            echo '- [Latest MusicXML](https://raw.githubusercontent.com/${{ github.repository }}/ci-output/latest/yellow-leaves.musicxml)'
            echo '- [Analysis](https://raw.githubusercontent.com/${{ github.repository }}/ci-output/latest/yellow-leaves.analysis.json)'
            echo '- [Classification](https://raw.githubusercontent.com/${{ github.repository }}/ci-output/latest/yellow-leaves.classification.json)'
            echo '- [Performance](https://raw.githubusercontent.com/${{ github.repository }}/ci-output/latest/yellow-leaves.performance.json)'
            echo '- [Recognition inventory](https://raw.githubusercontent.com/${{ github.repository }}/ci-output/latest/yellow-leaves.inventory.md)'
            echo '- [Missing-stem beam probe](https://raw.githubusercontent.com/${{ github.repository }}/ci-output/latest/yellow-leaves.beam-probe.md)'
          } >> "$GITHUB_STEP_SUMMARY"
