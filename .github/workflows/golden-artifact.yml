name: Golden conversion artifact

on:
  pull_request:

jobs:
  golden-artifact:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore main project
        run: dotnet restore SvgToMusicXmlPoc.csproj

      - name: Build main project
        run: dotnet build SvgToMusicXmlPoc.csproj --configuration Release --no-restore

      - name: Convert Yellow Leaves golden SVG
        id: convert
        continue-on-error: true
        run: |
          mkdir -p artifacts
          dotnet run --project SvgToMusicXmlPoc.csproj --configuration Release --no-build --no-launch-profile -- \
            convert \
            Golden/yellow-leaves-giya-kancheli.svg \
            References/catalog.json \
            artifacts/yellow-leaves.musicxml

      - name: Show generated files
        if: always()
        shell: bash
        run: |
          echo "Generated artifact contents:"
          find artifacts -maxdepth 1 -type f -printf '%f\n' | sort || true

      - name: Upload golden conversion artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yellow-leaves-pr-${{ github.event.pull_request.number }}
          path: |
            artifacts/yellow-leaves.musicxml
            artifacts/yellow-leaves.analysis.json
            artifacts/yellow-leaves.classification.json
            artifacts/yellow-leaves.performance.json
          if-no-files-found: error
          retention-days: 14

      - name: Add download hint to workflow summary
        if: always()
        run: |
          {
            echo '## Golden conversion artifact'
            echo
            echo 'Download **yellow-leaves-pr-${{ github.event.pull_request.number }}** from the Artifacts section at the bottom of this workflow run.'
            echo
            echo 'Open `yellow-leaves.musicxml` directly in MuseScore after unzipping.'
          } >> "$GITHUB_STEP_SUMMARY"
