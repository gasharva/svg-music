name: MusicXML round-trip

on:
  push:
    branches: [ master ]
    paths:
      - 'MusicXml/**'
      - 'Samples/step-by-step/*.musicxml'
      - '.github/workflows/musicxml-roundtrip.yml'
      - 'SvgToMusicXmlPoc.sln'
  workflow_dispatch:

jobs:
  roundtrip:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build MusicXml/MusicXml.csproj --configuration Release

      - name: Round-trip real MuseScore MusicXML
        run: |
          mkdir -p artifacts/musicxml
          dotnet run --project MusicXml/MusicXml.csproj --configuration Release --no-build -- \
            Samples/step-by-step/kancheli-mimino-reference.musicxml \
            artifacts/musicxml/kancheli-mimino-reference.roundtrip.musicxml \
            | tee artifacts/musicxml/summary.txt

      - name: XML parse smoke test
        run: python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='artifacts/musicxml/kancheli-mimino-reference.roundtrip.musicxml'
          root=ET.parse(p).getroot()
          assert root.tag == 'score-partwise'
          print('XML parser OK:', p)
          PY

      - name: Semantic XML diff
        run: |
          python3 - <<'PY' | tee artifacts/musicxml/semantic-diff.txt
          import xml.etree.ElementTree as ET

          before_path = 'Samples/step-by-step/kancheli-mimino-reference.musicxml'
          after_path = 'artifacts/musicxml/kancheli-mimino-reference.roundtrip.musicxml'
          before = ET.parse(before_path).getroot()
          after = ET.parse(after_path).getroot()
          differences = []
          max_differences = 500

          def clean_text(value):
              if value is None:
                  return ''
              return ' '.join(value.split())

          def tag_name(tag):
              return tag.rsplit('}', 1)[-1]

          def describe_child(child, index):
              tag = tag_name(child.tag)
              hints = []
              for key in ('number', 'id', 'type', 'staff', 'voice'):
                  if key in child.attrib:
                      hints.append(f"{key}={child.attrib[key]!r}")
              if tag == 'measure' and 'number' in child.attrib:
                  return f"measure[@number={child.attrib['number']!r}]"
              return f"{tag}[{index}]" + (f"[{', '.join(hints)}]" if hints else '')

          def add(message):
              if len(differences) < max_differences:
                  differences.append(message)

          def compare(a, b, path):
              if tag_name(a.tag) != tag_name(b.tag):
                  add(f"{path}: ELEMENT changed {tag_name(a.tag)!r} -> {tag_name(b.tag)!r}")
                  return

              a_attrs = dict(a.attrib)
              b_attrs = dict(b.attrib)
              for key in sorted(a_attrs.keys() - b_attrs.keys()):
                  add(f"{path}: LOST attribute {key}={a_attrs[key]!r}")
              for key in sorted(b_attrs.keys() - a_attrs.keys()):
                  add(f"{path}: ADDED attribute {key}={b_attrs[key]!r}")
              for key in sorted(a_attrs.keys() & b_attrs.keys()):
                  if a_attrs[key] != b_attrs[key]:
                      add(f"{path}: CHANGED attribute {key}: {a_attrs[key]!r} -> {b_attrs[key]!r}")

              at = clean_text(a.text)
              bt = clean_text(b.text)
              if at != bt:
                  add(f"{path}: TEXT changed {at!r} -> {bt!r}")

              ac = list(a)
              bc = list(b)
              if len(ac) != len(bc):
                  add(f"{path}: CHILD COUNT changed {len(ac)} -> {len(bc)}")

              common = min(len(ac), len(bc))
              for i in range(common):
                  child_path = path + '/' + describe_child(ac[i], i)
                  compare(ac[i], bc[i], child_path)

              for i in range(common, len(ac)):
                  child = ac[i]
                  add(f"{path}: LOST child {describe_child(child, i)}")
              for i in range(common, len(bc)):
                  child = bc[i]
                  add(f"{path}: ADDED child {describe_child(child, i)}")

          compare(before, after, '/score-partwise')

          if differences:
              print(f"Semantic XML differences: {len(differences)} shown (limit {max_differences}).")
              for item in differences:
                  print(item)
          else:
              print('Semantic XML diff: no element, text, attribute, or child-order differences.')
          PY

      - name: Upload round-trip artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicxml-roundtrip-${{ github.sha }}
          path: artifacts/musicxml/
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          {
            echo '## MusicXML round-trip PoC'
            echo
            echo 'The reader deserialized the complete XSD-generated MusicXML model, the writer serialized it again, and the compact note/rest projection survived unchanged.'
            echo
            echo 'The artifact also contains **semantic-diff.txt**, which compares the original and round-trip XML by element order, attributes and values while ignoring formatting whitespace.'
            echo
            echo 'Download the **musicxml-roundtrip-${{ github.sha }}** artifact and open `kancheli-mimino-reference.roundtrip.musicxml` in MuseScore for the visual smoke test.'
            echo
            echo '### Typed projection'
            echo '```text'
            cat artifacts/musicxml/summary.txt
            echo '```'
            echo
            echo '### Semantic XML diff (first 120 lines)'
            echo '```text'
            head -n 120 artifacts/musicxml/semantic-diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
