name: MusicXML round-trip

on:
  push:
    branches: [ master ]
    paths:
      - 'MusicXml/**'
      - 'MusicXmlModelGenerator/**'
      - 'Samples/step-by-step/*.musicxml'
      - '.github/workflows/musicxml-roundtrip.yml'
      - 'SvgToMusicXmlPoc.sln'
  workflow_dispatch:

jobs:
  roundtrip:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build MusicXml/MusicXml.csproj --configuration Release

      - name: Round-trip real MuseScore MusicXML
        run: |
          mkdir -p artifacts/musicxml
          dotnet run --project MusicXml/MusicXml.csproj --configuration Release --no-build -- \
            Samples/step-by-step/kancheli-mimino-reference.musicxml \
            artifacts/musicxml/kancheli-mimino-reference.roundtrip.musicxml \
            | tee artifacts/musicxml/summary.txt

      - name: XML parse smoke test
        run: python - <<'PY'
          import xml.etree.ElementTree as ET
          p='artifacts/musicxml/kancheli-mimino-reference.roundtrip.musicxml'
          root=ET.parse(p).getroot()
          assert root.tag == 'score-partwise'
          print('XML parser OK:', p)
          PY

      - name: Semantic XML diff
        run: |
          cp artifacts/musicxml/kancheli-mimino-reference.roundtrip.semantic-diff.txt artifacts/musicxml/semantic-diff.txt
          head -n 120 artifacts/musicxml/semantic-diff.txt

      - name: Upload round-trip artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicxml-roundtrip-${{ github.sha }}
          path: artifacts/musicxml/
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          {
            echo '## MusicXML round-trip PoC'
            echo
            echo 'The reader deserialized the complete XSD-generated MusicXML model, the writer serialized it again, and the compact note/rest projection survived unchanged.'
            echo
            echo 'The artifact also contains **semantic-diff.txt**.'
            echo
            echo '### Typed projection'
            echo '```text'
            cat artifacts/musicxml/summary.txt
            echo '```'
            echo
            echo '### Semantic XML diff (first 120 lines)'
            echo '```text'
            head -n 120 artifacts/musicxml/semantic-diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
