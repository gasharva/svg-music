name: SvgStructure step-by-step

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: svg-structure-step-by-step
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SvgStructureDiagnostics/SvgStructureDiagnostics.csproj

      - name: Build
        run: dotnet build SvgStructureDiagnostics/SvgStructureDiagnostics.csproj --configuration Release --no-restore

      - name: Run step-by-step samples
        run: >-
          dotnet run
          --project SvgStructureDiagnostics/SvgStructureDiagnostics.csproj
          --configuration Release
          --no-build
          --no-launch-profile
          -- Samples/step-by-step

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: svg-structure-step-by-step-${{ github.sha }}
          path: Samples/step-by-step/_artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/svg-music-pages
          mkdir -p /tmp/svg-music-pages/latest/step-by-step
          cp -R Samples/step-by-step/_artifacts/. /tmp/svg-music-pages/latest/step-by-step/
          touch /tmp/svg-music-pages/.nojekyll
          cat > /tmp/svg-music-pages/index.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>svg-music diagnostics</title>
          <meta http-equiv="refresh" content="0; url=latest/step-by-step/"></head>
          <body><a href="latest/step-by-step/">Open latest step-by-step report</a></body></html>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/svg-music-pages

      - name: Publish latest report to ci-output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/step-by-step-latest
          mkdir -p /tmp/step-by-step-latest
          cp -R Samples/step-by-step/_artifacts/. /tmp/step-by-step-latest/
          cat > /tmp/step-by-step-latest/source.txt <<EOF
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Rendered report: https://gasharva.github.io/svg-music/latest/step-by-step/
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin ci-output:refs/remotes/origin/ci-output 2>/dev/null; then
            git switch -C ci-output origin/ci-output
          else
            git switch --orphan ci-output
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p latest
          rm -rf latest/step-by-step
          mkdir -p latest/step-by-step
          cp -R /tmp/step-by-step-latest/. latest/step-by-step/
          git add -A latest/step-by-step
          if git diff --cached --quiet; then
            echo "ci-output/latest/step-by-step is already up to date"
          else
            git commit -m "Update SvgStructure diagnostics from ${{ github.sha }}"
            git push origin ci-output
          fi

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo '## SvgStructure diagnostics'
            echo
            echo '- Rendered report: https://gasharva.github.io/svg-music/latest/step-by-step/'
            echo '- Download the **svg-structure-step-by-step-${{ github.sha }}** artifact from this run.'
            echo '- A repository copy is also kept in the `ci-output` branch.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    name: Deploy GitHub Pages
    needs: analyze
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
